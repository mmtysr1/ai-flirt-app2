<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flirt AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between">

  <!-- Üst Bar -->
  <header class="p-4 bg-slate-800 border-b border-slate-700 flex justify-between items-center">
    <h1 class="text-xl font-bold text-pink-500">Ayla (22)</h1>
    <button id="btn-create-model" onclick="createNewModel()" class="bg-pink-600 hover:bg-pink-700 px-4 py-2 rounded-lg text-sm font-semibold transition">
      + Yeni Model Oluştur
    </button>
  </header>

  <!-- Chat Alanı -->
  <main id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-4 max-w-2xl mx-auto w-full">
    <div class="bg-slate-800 p-3 rounded-lg max-w-xs text-sm border border-slate-700">
      Selam! Ben Ayla. Seninle tanışmak için sabırsızlanıyorum 😊
    </div>
  </main>

  <!-- Alt Mesaj Gönderme Barları -->
  <footer class="p-4 bg-slate-800 border-t border-slate-700 max-w-2xl mx-auto w-full">
    <div class="flex gap-2 mb-2">
      <button onclick="requestPhoto()" class="flex-1 bg-purple-600 hover:bg-purple-700 text-xs py-2 rounded font-semibold transition">
        📸 Gerçekçi Foto İstet
      </button>
    </div>
    <form id="chat-form" onsubmit="sendMessage(event)" class="flex gap-2">
      <input type="text" id="user-input" placeholder="Mesajını yaz..." class="flex-1 bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-pink-500">
      <button type="submit" class="bg-pink-600 hover:bg-pink-700 px-5 py-2 rounded-lg font-semibold text-sm">Gönder</button>
    </form>
  </footer>

  <script>
    const chatHistory = [];

    async function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('user-input');
      const message = input.value.trim();
      if (!message) return;

      appendMessage('user', message);
      input.value = '';
      chatHistory.push({ role: 'user', content: message });

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: chatHistory })
        });
        const data = await res.json();
        if (data.message) {
          appendMessage('assistant', data.message);
          chatHistory.push({ role: 'assistant', content: data.message });
        } else {
          appendMessage('assistant', 'Bir sorun oluştu, tekrar yazar mısın?');
        }
      } catch (err) {
        appendMessage('assistant', 'Bağlantı hatası yaşandı.');
      }
    }

    async function requestPhoto() {
      const lastMessage = chatHistory.length > 0 ? chatHistory[chatHistory.length - 1].content : "casual photo";
      appendMessage('assistant', 'Senin için bir fotoğraf çekiyorum, bekle biraz... 📸');

      try {
        const res = await fetch('/api/generate-image', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: lastMessage, chatHistory: lastMessage })
        });
        const data = await res.json();
        if (data.imageUrl) {
          appendImage(data.imageUrl);
        } else {
          appendMessage('assistant', 'Fotoğraf çekerken bir aksilik oldu.');
        }
      } catch (err) {
        appendMessage('assistant', 'Görsel sunucusuna bağlanılamadı.');
      }
    }

    function createNewModel() {
      alert("Yeni model oluşturma ekranı aktif edildi! İlerleyen versiyonda buraya dinamik karakter seçimi bağlayacağız.");
    }

    function appendMessage(role, text) {
      const chatBox = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = role === 'user' 
        ? 'bg-pink-600 p-3 rounded-lg max-w-xs text-sm ml-auto text-white' 
        : 'bg-slate-800 p-3 rounded-lg max-w-xs text-sm border border-slate-700 text-white';
      div.innerText = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendImage(url) {
      const chatBox = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = 'bg-slate-800 p-2 rounded-lg max-w-xs border border-slate-700';
      div.innerHTML = `<img src="${url}" class="rounded-lg w-full h-auto" alt="AI Photo">`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
